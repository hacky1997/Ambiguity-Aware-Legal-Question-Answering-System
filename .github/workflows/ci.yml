name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,retrieval,observability,privacy,api]"
      - run: python -m ruff check legalrag tests scripts
      - run: python -m mypy legalrag
      - run: python -m pytest -q
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m pip install pip-audit
      - run: pip-audit
      - run: python scripts/run_eval.py --golden data/golden.jsonl --system legalrag.eval_system:build_system --baseline data/baseline.json
