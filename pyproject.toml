[project]
name = "legalrag"
version = "0.1.0"
description = "Ambiguity-aware legal question answering over Indian criminal law"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
guardrails = [
    "nemoguardrails>=0.16.0",
]
observability = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
retrieval = [
    "qdrant-client>=1.12",
    "rank-bm25>=0.2.2",
]
privacy = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
]
api = [
    "fastapi>=0.115",
    "httpx>=0.27",
]
audit = [
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["legalrag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["legalrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
